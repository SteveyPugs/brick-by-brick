name: BrickByBrick
options:
  bundleIdPrefix: com.steveypugs
  deploymentTarget:
    iOS: "17.0"
targets:
  BrickByBrick:
    type: application
    platform: iOS
    sources:
      - BrickByBrickApp.swift
      - Models.swift
      - BuildStore.swift
      - BuildsView.swift
      - CreateBuildView.swift
      - BuildDetailView.swift
      - CreateWallView.swift
      - WallDetailView.swift
      - CreateBrickView.swift
      - SharedViews.swift
      - PlannerView.swift
      - PlanGenerator.swift
      - GuidedGoalStore.swift
      - GuidedGoalAI.swift
      - GuidedGoalViews.swift
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steveypugs.brickbybrick
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Brick by Brick
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  BrickByBrickModelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ModelStoreTests.swift
      - GuidedGoalTests.swift
    dependencies:
      - target: BrickByBrick
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  BrickByBrickUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
      - GuidedGoalsUITests.swift
    dependencies:
      - target: BrickByBrick
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  BrickByBrick:
    build:
      targets:
        BrickByBrick: all
    test:
      targets:
        - BrickByBrickModelTests
        - BrickByBrickUITests
